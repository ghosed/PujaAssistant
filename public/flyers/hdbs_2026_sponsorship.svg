<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="sponsorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="goldSponsor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#sponsorGrad)"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="url(#goldSponsor)" stroke-width="4" rx="16"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="6,4" rx="12"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="18" font-weight="700" fill="#fef08a" letter-spacing="3">HOUSTON DURGA BARI SOCIETY</text>
  <text x="400" y="125" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="30" font-weight="800" fill="url(#goldSponsor)" letter-spacing="2">2026 PUJA SPONSORSHIP PACKAGES</text>
  <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#bbf7d0">Support Maa Durga's Grand Worship &amp; Community Anna Bhog Distribution</text>

  <!-- Tier 1: Grand Patron -->
  <g transform="translate(60, 180)">
    <rect width="680" height="130" rx="10" fill="url(#whiteCard)" stroke="#eab308" stroke-width="2"/>
    <rect width="200" height="30" rx="6" fill="#ca8a04"/>
    <text x="100" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">GRAND PATRON — $5,000</text>
    
    <text x="25" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#15803d">Included Benefits:</text>
    <text x="25" y="78" font-family="sans-serif" font-size="12" fill="#334155">• Name inscribed as Grand Patron in Sharodotsav Souvenir &amp; Stage Display</text>
    <text x="25" y="98" font-family="sans-serif" font-size="12" fill="#334155">• Dedicated Family Puja Sankalpa performed on all days (Saptami, Ashtami, Nabami)</text>
    <text x="25" y="118" font-family="sans-serif" font-size="12" fill="#334155">• 2 Reserved VIP On-Campus Parking Passes &amp; 8 Priority Bhog Dining Passes</text>
  </g>

  <!-- Tier 2: Maha Sponsor -->
  <g transform="translate(60, 325)">
    <rect width="680" height="130" rx="10" fill="url(#whiteCard)" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="200" height="30" rx="6" fill="#16a34a"/>
    <text x="100" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">MAHA SPONSOR — $2,500</text>
    
    <text x="25" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#15803d">Included Benefits:</text>
    <text x="25" y="78" font-family="sans-serif" font-size="12" fill="#334155">• Full-page color acknowledgment in 2026 Puja Commemorative Magazine</text>
    <text x="25" y="98" font-family="sans-serif" font-size="12" fill="#334155">• Family Sankalpa for Maha Ashtami &amp; Sandhi Puja</text>
    <text x="25" y="118" font-family="sans-serif" font-size="12" fill="#334155">• 1 Reserved VIP Parking Pass &amp; 6 Priority Bhog Dining Passes</text>
  </g>

  <!-- Tier 3: Family Puja Sponsor -->
  <g transform="translate(60, 470)">
    <rect width="680" height="130" rx="10" fill="url(#whiteCard)" stroke="#0d9488" stroke-width="1.5"/>
    <rect width="240" height="30" rx="6" fill="#0d9488"/>
    <text x="120" y="20" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff">FAMILY PUJA SPONSOR — $500</text>
    
    <text x="25" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f766e">Included Benefits:</text>
    <text x="25" y="78" font-family="sans-serif" font-size="12" fill="#334155">• Family Gotra &amp; Name Sankalpa during Pushpanjali ritual</text>
    <text x="25" y="98" font-family="sans-serif" font-size="12" fill="#334155">• 4 Complimentary Anna Bhog meal packets per puja day</text>
    <text x="25" y="118" font-family="sans-serif" font-size="12" fill="#334155">• Commemorative Puja souvenir copy</text>
  </g>

  <!-- Tier 4 & 5 Grid: Anna Bhog Sponsor & Pushpanjali -->
  <g transform="translate(60, 615)">
    <!-- Anna Bhog -->
    <rect width="330" height="150" rx="10" fill="url(#whiteCard)" stroke="#b45309" stroke-width="1.5"/>
    <rect width="210" height="28" rx="6" fill="#b45309"/>
    <text x="105" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">DAILY BHOG SPONSOR — $250</text>
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#334155">• Sponsors Anna Bhog for 200+ devotees</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#334155">• Special prasad packet blessed at sanctum</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#334155">• Sankalpa for one designated day</text>
    <text x="20" y="125" font-family="sans-serif" font-size="11" font-weight="600" fill="#b45309">Available for Friday, Saturday, or Sunday</text>

    <!-- Pushpanjali -->
    <g transform="translate(350, 0)">
      <rect width="330" height="150" rx="10" fill="url(#whiteCard)" stroke="#9333ea" stroke-width="1.5"/>
      <rect width="210" height="28" rx="6" fill="#9333ea"/>
      <text x="105" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">PUSHPANJALI &amp; PRANAM — $51</text>
      <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#334155">• Individual &amp; Family Floral Offering token</text>
      <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#334155">• Name recited during morning Pushpanjali</text>
      <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#334155">• Blessed sacred thread (Chandan/Duroba)</text>
      <text x="20" y="125" font-family="sans-serif" font-size="11" font-weight="600" fill="#9333ea">Valid for any single day Pushpanjali</text>
    </g>
  </g>

  <!-- Online Registration Box -->
  <g transform="translate(60, 785)">
    <rect width="680" height="160" rx="12" fill="#0f172a" stroke="#facc15" stroke-width="1.5"/>
    <text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fef08a">HOW TO REGISTER &amp; CONTRIBUTE</text>
    <text x="30" y="65" font-family="sans-serif" font-size="13" fill="#e2e8f0">• Online Portal: Visit durgabari.org/2026-puja/register/ (Credit Card, Zelle, PayPal accepted)</text>
    <text x="30" y="90" font-family="sans-serif" font-size="13" fill="#e2e8f0">• Zelle Donations: treasurer@durgabari.org (Include "2026 Puja - [Your Gotra/Name]" in memo)</text>
    <text x="30" y="115" font-family="sans-serif" font-size="13" fill="#e2e8f0">• Check Payments: Payable to "Houston Durga Bari Society", Mail: 13944 Schiller Rd, Houston TX 77082</text>
    <text x="30" y="140" font-family="sans-serif" font-size="12" font-weight="600" fill="#4ade80">✓ Tax Exemption: HDBS is a 501(c)(3) tax-exempt religious charity. Receipts emailed instantly.</text>
  </g>

  <text x="400" y="990" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#fef9c3">Puja Committee Helpline: (281) 530-0304 | Email: treasurer@durgabari.org</text>
  <text x="400" y="1030" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#86efac">May Maa Durga shower your family with health, harmony, and joy!</text>
</svg>
