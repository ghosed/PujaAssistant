<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="sponsorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldSponsor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="whiteCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#sponsorGrad)"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="url(#goldSponsor)" stroke-width="3" rx="16"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="6,4" rx="12"/>

  <text x="400" y="75" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="18" font-weight="700" fill="#fef08a" letter-spacing="3">HOUSTON DURGA BARI SOCIETY</text>
  <text x="400" y="115" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="28" font-weight="800" fill="url(#goldSponsor)" letter-spacing="2">2026 PUJA REGISTRATION &amp; SPONSORSHIP</text>
  <text x="400" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Official Guidelines from https://durgabari.org/2026-puja/registration/</text>

  <!-- Banner: Day & Evening Passes Available -->
  <g transform="translate(60, 165)">
    <rect width="680" height="95" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="800" fill="#fde047">🎟️ LIMITED DAY &amp; EVENING PASSES AVAILABLE</text>
    <text x="25" y="55" font-family="sans-serif" font-size="12.5" fill="#f8fafc">• Available under: Puja Registration &amp; Donation &gt; Special Processing &gt; Day Passes.</text>
    <text x="25" y="78" font-family="sans-serif" font-size="12.5" fill="#f8fafc">• Includes cultural events &amp; meals (lunch+dinner for Day Pass, dinner only for Evening Pass). Free shuttle from West Oaks Mall.</text>
  </g>

  <!-- Registration Structure Box -->
  <g transform="translate(60, 275)">
    <rect width="680" height="135" rx="10" fill="url(#whiteCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="260" height="26" rx="5" fill="#0284c7"/>
    <text x="130" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">PUJA REGISTRATION TYPES &amp; CATEGORIES</text>
    <text x="25" y="48" font-family="sans-serif" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Puja Selection:</tspan> Register by Puja (Durga Puja, Kali Puja, Saraswati Puja, or All 3 Pujas bundle).</text>
    <text x="25" y="70" font-family="sans-serif" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Price Types:</tspan> Family Registration or Individual Registration.</text>
    <text x="25" y="92" font-family="sans-serif" font-size="12.5" fill="#0f172a"><tspan font-weight="700">Categories:</tspan> Returning Member, New Non-Member, Out-of-Towner (OOT), &amp; Full-Time Student.</text>
    <text x="25" y="114" font-family="sans-serif" font-size="12" fill="#0284c7"><tspan font-weight="700">★ Out-of-Towners:</tspan> Eligible for Member rates regardless of membership status (with address verification)!</text>
  </g>

  <!-- Sponsorship Tiers & Assigned Parking -->
  <g transform="translate(60, 425)">
    <rect width="680" height="280" rx="10" fill="url(#whiteCard)" stroke="#eab308" stroke-width="2"/>
    <rect width="300" height="28" rx="6" fill="#ca8a04"/>
    <text x="150" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff">SPONSORSHIP TIERS &amp; PARKING PRIVILEGES</text>

    <!-- Table Header -->
    <rect x="20" y="38" width="640" height="28" fill="#f1f5f9" rx="4"/>
    <text x="35" y="56" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Category</text>
    <text x="170" y="56" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Amount</text>
    <text x="320" y="56" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Parking Assigned</text>
    <text x="490" y="56" font-family="sans-serif" font-size="12" font-weight="700" fill="#334155">Key Benefits</text>

    <!-- Diamond -->
    <text x="35" y="90" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#0284c7">Diamond</text>
    <text x="170" y="90" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">$5,000+</text>
    <text x="320" y="90" font-family="sans-serif" font-size="12" fill="#0f172a">Main Parking (HDBS)</text>
    <text x="490" y="90" font-family="sans-serif" font-size="11.5" fill="#475569">Named slots for $10K</text>

    <!-- Emerald -->
    <text x="35" y="125" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#059669">Emerald</text>
    <text x="170" y="125" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">$2,200 – $4,999</text>
    <text x="320" y="125" font-family="sans-serif" font-size="12" fill="#0f172a">Main Parking (HDBS)</text>
    <text x="490" y="125" font-family="sans-serif" font-size="11.5" fill="#475569">On-premises VIP spot</text>

    <!-- Platinum -->
    <text x="35" y="160" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#64748b">Platinum</text>
    <text x="170" y="160" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">$1,500 – $2,199</text>
    <text x="320" y="160" font-family="sans-serif" font-size="12" fill="#0f172a">Kala Bhavan (KB) Parking</text>
    <text x="490" y="160" font-family="sans-serif" font-size="11.5" fill="#475569">Dedicated lot access</text>

    <!-- Gold -->
    <text x="35" y="195" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#d97706">Gold</text>
    <text x="170" y="195" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">$1,000 – $1,499</text>
    <text x="320" y="195" font-family="sans-serif" font-size="12" fill="#0f172a">Green Field Parking</text>
    <text x="490" y="195" font-family="sans-serif" font-size="11.5" fill="#475569">KB for CT Gold</text>

    <!-- Silver -->
    <text x="35" y="230" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#475569">Silver</text>
    <text x="170" y="230" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">$750 – $999</text>
    <text x="320" y="230" font-family="sans-serif" font-size="12" fill="#0f172a">Green Field Parking</text>
    <text x="490" y="230" font-family="sans-serif" font-size="11.5" fill="#475569">Visiting parent courtesy</text>

    <!-- Benefactor -->
    <text x="35" y="265" font-family="sans-serif" font-size="12.5" font-weight="700" fill="#7c3aed">Benefactor</text>
    <text x="170" y="265" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">$400+ ($200+ Seniors)</text>
    <text x="320" y="265" font-family="sans-serif" font-size="12" fill="#0f172a">Green Field (Apply)</text>
    <text x="490" y="265" font-family="sans-serif" font-size="11.5" fill="#475569">Subject to availability</text>
  </g>

  <!-- Important Rules Box -->
  <g transform="translate(60, 720)">
    <rect width="680" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="340" y="28" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="700" fill="#fef08a">IMPORTANT REGISTRATION GUIDELINES</text>
    <text x="25" y="55" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Senior Discount: Minimum 70 years (Primary Registrant &amp; Spouse only).</text>
    <text x="25" y="77" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Children: Children above 22 must register separately (extended to 26 if unmarried student/unemployed).</text>
    <text x="25" y="99" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Students: Full-time students only (valid student ID or tuition receipt required). Part-time/EMBA ineligible.</text>
    <text x="25" y="121" font-family="sans-serif" font-size="12" fill="#e2e8f0">• Parking Warning: Parking strictly NOT permitted at Alief High School. Free shuttle at West Oaks Mall.</text>
  </g>

  <!-- Registration Portal Link -->
  <g transform="translate(60, 885)">
    <rect width="680" height="85" rx="10" fill="#0f172a" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="340" y="32" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fef08a">OFFICIAL ONLINE REGISTRATION PORTAL</text>
    <text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">https://durgabari.org/2026-puja/registration/</text>
  </g>

  <text x="400" y="1005" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Registration Inquiries: registration@durgabari.org | General: pc@durgabari.org</text>
  <text x="400" y="1035" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#94a3b8">Houston Durga Bari Society is a 501(c)(3) tax-exempt non-profit organization.</text>
</svg>
