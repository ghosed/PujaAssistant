<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="16"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="8,4" rx="12"/>

  <!-- Top Festive Header -->
  <text x="400" y="80" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="20" font-weight="700" fill="#fef08a" letter-spacing="4">॥ শ্রী শ্রী দুর্গায়ৈ নমঃ ॥</text>
  <text x="400" y="115" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="28" font-weight="800" fill="url(#goldGrad)" letter-spacing="2">HOUSTON DURGA BARI SOCIETY</text>
  <text x="400" y="142" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#fef3c7" letter-spacing="1">13944 Schiller Road, Houston, TX 77082 • durgabari.org</text>

  <!-- Event Title Ribbon -->
  <rect x="100" y="165" width="600" height="55" rx="8" fill="#b45309" stroke="#fef08a" stroke-width="2"/>
  <text x="400" y="202" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="2">SHARODOTSAV 2026 SCHEDULE</text>

  <!-- Event Dates Summary -->
  <text x="400" y="245" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#fde047">Mahalaya &amp; Anandamela: Oct 11, 2026 | Durga Puja: Oct 16 – 18, 2026</text>

  <!-- Section 1: Pre-Puja Card -->
  <g transform="translate(60, 265)">
    <rect width="680" height="135" rx="10" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="680" height="32" rx="10" fill="#9a3412"/>
    <text x="20" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">PRE-PUJA RITUALS &amp; FESTIVALS</text>
    
    <text x="20" y="55" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">Saturday, Oct 10, 2026 — TIL TARPAN</text>
    <text x="20" y="73" font-family="sans-serif" font-size="12" fill="#451a03">8:00 AM – 11:30 AM: Ancestral Tarpan ritual at temple water pavilion. Samagri provided.</text>

    <text x="20" y="98" font-family="sans-serif" font-size="13" font-weight="700" fill="#991b1b">Sunday, Oct 11, 2026 — MAHALAYA &amp; ANANDAMELA</text>
    <text x="20" y="116" font-family="sans-serif" font-size="12" fill="#451a03">6:00 AM: Mahishasuramardini Invocatory Chanting • 4:00 PM – 10:00 PM: Anandamela Grand Food Festival</text>
  </g>

  <!-- Section 2: Sashthi & Saptami Card -->
  <g transform="translate(60, 420)">
    <rect width="680" height="135" rx="10" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="680" height="32" rx="10" fill="#b91c1c"/>
    <text x="20" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">FRIDAY, OCT 16, 2026 — MAHA SASHTHI &amp; MAHA SAPTAMI</text>
    
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">08:00 AM:</tspan> Bodhan, Amantran &amp; Adhivas (Bel-tol invocation)</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">09:30 AM:</tspan> Navapatrika Pravesh &amp; Snan (Kola Bou Snan) • <tspan font-weight="700" fill="#991b1b">10:30 AM:</tspan> Saptami Puja</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">12:00 PM:</tspan> Saptami Pushpanjali • <tspan font-weight="700" fill="#991b1b">01:00 PM – 03:00 PM:</tspan> Anna Bhog Prasad Distribution</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">05:30 PM:</tspan> Sandhya Arati &amp; Dhunuchi Naach • <tspan font-weight="700" fill="#991b1b">07:30 PM:</tspan> Inaugural Classical Cultural Program</text>
  </g>

  <!-- Section 3: Ashtami & Nabami Card -->
  <g transform="translate(60, 575)">
    <rect width="680" height="155" rx="10" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="680" height="32" rx="10" fill="#b91c1c"/>
    <text x="20" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">SATURDAY, OCT 17, 2026 — MAHA ASHTAMI &amp; MAHA NABAMI</text>
    
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">08:30 AM:</tspan> Maha Ashtami Puja • <tspan font-weight="700" fill="#991b1b">10:30 AM / 11:15 AM / 12:00 PM:</tspan> Ashtami Pushpanjali Batches</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">12:15 PM:</tspan> Kumari Puja (Devi manifestation veneration)</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">01:00 PM – 03:30 PM:</tspan> Maha Bhog Distribution (Khichuri, Labra, Payesh)</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">04:45 PM – 05:33 PM:</tspan> SANDHI PUJA (108 Lotus &amp; 108 Pradip offerings)</text>
    <text x="20" y="135" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">06:00 PM:</tspan> Nabami Homa • <tspan font-weight="700" fill="#991b1b">08:00 PM:</tspan> Dhunuchi Competition • <tspan font-weight="700" fill="#991b1b">09:00 PM:</tspan> Kolkata Star Concert</text>
  </g>

  <!-- Section 4: Dashami Card -->
  <g transform="translate(60, 750)">
    <rect width="680" height="135" rx="10" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="680" height="32" rx="10" fill="#78350f"/>
    <text x="20" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffffff">SUNDAY, OCT 18, 2026 — VIJAYA DASHAMI</text>
    
    <text x="20" y="55" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">09:00 AM:</tspan> Vijaya Dashami Puja • <tspan font-weight="700" fill="#991b1b">10:00 AM:</tspan> Darpan Visarjan (Mirror immersion)</text>
    <text x="20" y="75" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">11:30 AM – 02:00 PM:</tspan> Sindoor Khela &amp; Devi Boran (Celebration with Dhaak &amp; Kanshi)</text>
    <text x="20" y="95" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">01:30 PM:</tspan> Vijaya Bhog &amp; Mishti Mukh • <tspan font-weight="700" fill="#991b1b">03:30 PM:</tspan> Shanti Jal &amp; Kolakoli (Embrace)</text>
    <text x="20" y="115" font-family="sans-serif" font-size="12" fill="#451a03"><tspan font-weight="700" fill="#991b1b">04:30 PM:</tspan> Bisarjan Procession &amp; Symbolic Ghat Visarjan ceremony</text>
  </g>

  <!-- Footer Banner -->
  <rect x="60" y="905" width="680" height="120" rx="10" fill="#1c1917" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="400" y="935" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fef08a">IMPORTANT LOGISTICS &amp; GUIDELINES</text>
  <text x="80" y="960" font-family="sans-serif" font-size="12" fill="#e7e5e4">• PARKING: On-site (seniors/sponsors/ADA) + West Oaks Mall overflow lot with free shuttles every 10 min.</text>
  <text x="80" y="980" font-family="sans-serif" font-size="12" fill="#e7e5e4">• BHOG PASSES: Online registration required at durgabari.org/2026-puja/ for seating batch tokens.</text>
  <text x="80" y="1000" font-family="sans-serif" font-size="12" fill="#e7e5e4">• CONTACT: Houston Durga Bari Society, 13944 Schiller Rd • pujacommittee@durgabari.org • (281) 530-0304</text>

  <text x="400" y="1065" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fde047">Houston Durga Bari Society is a 501(c)(3) Non-Profit Organization. All donations tax-deductible.</text>
</svg>
