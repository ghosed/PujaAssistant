<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="anandaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="gold2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="lightBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#anandaGrad)"/>
  <rect x="25" y="25" width="750" height="1050" fill="none" stroke="url(#gold2Grad)" stroke-width="4" rx="16"/>
  <rect x="35" y="35" width="730" height="1030" fill="none" stroke="#fef08a" stroke-width="1" stroke-dasharray="6,4" rx="12"/>

  <text x="400" y="80" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="18" font-weight="700" fill="#fef08a" letter-spacing="3">HOUSTON DURGA BARI SOCIETY PRESENTS</text>
  <text x="400" y="125" text-anchor="middle" font-family="'Cinzel', serif, Georgia" font-size="34" font-weight="800" fill="url(#gold2Grad)" letter-spacing="2">ANANDAMELA 2026</text>
  <text x="400" y="155" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#ffffff">The Grand Bengali Culinary &amp; Cultural Extravaganza</text>

  <!-- Date & Venue Badge -->
  <rect x="140" y="175" width="520" height="50" rx="25" fill="#78350f" stroke="#facc15" stroke-width="2"/>
  <text x="400" y="207" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fef08a">SUNDAY, OCTOBER 11, 2026 • 4:00 PM – 10:00 PM</text>

  <!-- Location Info -->
  <text x="400" y="255" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#ffedd5">Houston Durga Bari Society Grounds • 13944 Schiller Rd, Houston, TX 77082</text>

  <!-- Food Highlights Container -->
  <g transform="translate(60, 280)">
    <rect width="680" height="290" rx="12" fill="url(#lightBox)" stroke="#b45309" stroke-width="2"/>
    <rect width="680" height="38" rx="12" fill="#9a3412"/>
    <text x="25" y="25" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">🍲 25+ AUTHENTIC HOMESTYLE BENGALI FOOD BOOTHS</text>

    <!-- Column 1 -->
    <text x="30" y="70" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">Appetizers &amp; Street Delights:</text>
    <text x="30" y="92" font-family="sans-serif" font-size="13" fill="#451a03">• Kolkata Style Phuchka &amp; Churmur</text>
    <text x="30" y="112" font-family="sans-serif" font-size="13" fill="#451a03">• Crunchy Fish Fry (Bhetki) with Kasundi</text>
    <text x="30" y="132" font-family="sans-serif" font-size="13" fill="#451a03">• Vegetable &amp; Mochar Chop</text>
    <text x="30" y="152" font-family="sans-serif" font-size="13" fill="#451a03">• Kolkata Egg Roll &amp; Chicken Roll</text>
    <text x="30" y="172" font-family="sans-serif" font-size="13" fill="#451a03">• Singara &amp; Bengali Ghugni Chaat</text>

    <!-- Column 2 -->
    <text x="370" y="70" font-family="sans-serif" font-size="14" font-weight="700" fill="#991b1b">Entrees &amp; Sweet Treats:</text>
    <text x="370" y="92" font-family="sans-serif" font-size="13" fill="#451a03">• Kosha Mangsho &amp; Luchi combo</text>
    <text x="370" y="112" font-family="sans-serif" font-size="13" fill="#451a03">• Mughlai Paratha with Aloo Kasha</text>
    <text x="370" y="132" font-family="sans-serif" font-size="13" fill="#451a03">• Dhokar Dalna &amp; Basanti Pulao</text>
    <text x="370" y="152" font-family="sans-serif" font-size="13" fill="#451a03">• Traditional Mishti Doi (Earthen pots)</text>
    <text x="370" y="172" font-family="sans-serif" font-size="13" fill="#451a03">• Hot Rosogolla, Pantua &amp; Kheer Kadam</text>
    <text x="370" y="192" font-family="sans-serif" font-size="13" fill="#451a03">• Artisanal Pati Shapta &amp; Malpua</text>

    <!-- Note on Tokens -->
    <rect x="25" y="225" width="630" height="45" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1"/>
    <text x="340" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#991b1b">Note: Food purchased via Digital Token Booths or Cash/Credit cards at booth stalls.</text>
  </g>

  <!-- Cultural Schedule -->
  <g transform="translate(60, 595)">
    <rect width="680" height="240" rx="12" fill="url(#lightBox)" stroke="#b45309" stroke-width="2"/>
    <rect width="680" height="38" rx="12" fill="#7c2d12"/>
    <text x="25" y="25" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">🎭 CULTURAL EVENING AT SUR AUDITORIUM</text>

    <text x="30" y="70" font-family="sans-serif" font-size="13" fill="#451a03"><tspan font-weight="700" fill="#991b1b">04:30 PM:</tspan> Welcome Address by HDBS President &amp; Puja Convener</text>
    <text x="30" y="95" font-family="sans-serif" font-size="13" fill="#451a03"><tspan font-weight="700" fill="#991b1b">05:15 PM:</tspan> Houston Youth Orchestra presents "Melodies of Bengal"</text>
    <text x="30" y="120" font-family="sans-serif" font-size="13" fill="#451a03"><tspan font-weight="700" fill="#991b1b">06:30 PM:</tspan> Agomoni Dance Drama "Mahishasura Mardini" by HDBS Kala Bhavan</text>
    <text x="30" y="145" font-family="sans-serif" font-size="13" fill="#451a03"><tspan font-weight="700" fill="#991b1b">07:45 PM:</tspan> Community Chorus – Rabindra Sangeet &amp; Dwijendralal Roy songs</text>
    <text x="30" y="170" font-family="sans-serif" font-size="13" fill="#451a03"><tspan font-weight="700" fill="#991b1b">08:45 PM:</tspan> Folk Band "Baul &amp; Bhatiyali Fusion" live acoustic performance</text>
    <text x="30" y="200" font-family="sans-serif" font-size="13" fill="#451a03"><tspan font-weight="700" fill="#991b1b">10:00 PM:</tspan> Anandamela closing ceremonies &amp; announcement of Best Food Stall award</text>
  </g>

  <!-- Stall Registration Info -->
  <g transform="translate(60, 855)">
    <rect width="680" height="150" rx="12" fill="#1c1917" stroke="#facc15" stroke-width="1.5"/>
    <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#fef08a">FOOD STALL BOOKING &amp; VOLUNTEER INFO</text>
    <text x="30" y="60" font-family="sans-serif" font-size="12" fill="#f5f5f4">• Stall Registration Fee: $150 per stall (Includes 6ft table, 2 chairs, power outlet).</text>
    <text x="30" y="80" font-family="sans-serif" font-size="12" fill="#f5f5f4">• Food Safety: City of Houston Temporary Food Permit compliance required for warm food.</text>
    <text x="30" y="100" font-family="sans-serif" font-size="12" fill="#f5f5f4">• Registration Deadline: October 1, 2026 at durgabari.org/2026-puja/anandamela-stall/</text>
    <text x="30" y="120" font-family="sans-serif" font-size="12" fill="#f5f5f4">• Contact: anandamela@durgabari.org | Convener: Somnath Banerjee (713-555-0192)</text>
  </g>

  <text x="400" y="1040" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fde047">Admission to Anandamela grounds &amp; Sur Auditorium performances is FREE for all community members.</text>
</svg>
